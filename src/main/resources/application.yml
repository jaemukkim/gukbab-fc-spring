# 애플리케이션, H2 데이터베이스, JPA, 화면 템플릿의 공통 실행 설정입니다.
spring:
  application:
    name: gukbab-fc
  datasource:
    url: jdbc:h2:file:./data/gukbabfc
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false

server:
  port: 8080

app:
  admin:
    username: ${ADMIN_USERNAME:}
