<!DOCTYPE html>
<!-- 권한이 부족한 사용자의 접근을 안내하는 403 화면입니다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>접근 권한 안내 | 국밥FC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="error-page">
<main class="error-card">
    <p class="error-code">403</p>
    <h1>접근할 수 없는 메뉴입니다.</h1>
    <p>현재 계정에는 이 작업을 수행할 권한이 없습니다.</p>
    <div class="error-actions">
        <button class="secondary-button" type="button" onclick="history.back()">이전 화면</button>
        <a class="primary-link" th:href="@{/}">홈으로 이동</a>
    </div>
</main>
</body>
</html>
