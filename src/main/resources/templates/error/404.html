<!DOCTYPE html>
<!-- 존재하지 않는 페이지나 데이터를 요청했을 때 보여주는 화면입니다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>페이지를 찾을 수 없습니다 | 국밥FC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="error-page">
<main class="error-card">
    <p class="error-code">404</p>
    <h1>페이지를 찾을 수 없습니다.</h1>
    <p th:text="${message != null ? message : '요청한 페이지가 없거나 이동되었습니다.'}">
        요청한 페이지가 없거나 이동되었습니다.
    </p>
    <div class="error-actions">
        <button class="secondary-button" type="button" onclick="history.back()">이전 화면</button>
        <a class="primary-link" th:href="@{/}">홈으로 이동</a>
    </div>
</main>
</body>
</html>
