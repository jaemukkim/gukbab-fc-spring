<!DOCTYPE html>
<!-- 풋살 일정 정보와 회원별 참가 응답 현황을 보여주는 상세 화면입니다. -->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${schedule.title + ' | 국밥FC'}">풋살 일정 | 국밥FC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="simple-header">
    <a class="brand" th:href="@{/}">국밥FC</a>
    <nav>
        <a th:href="@{/schedules}">풋살 일정 목록</a>
        <a th:href="@{/mypage}">내 프로필</a>
    </nav>
</header>

<main class="content-page narrow-page">
    <div class="alert success" th:if="${param.updated}">풋살 일정을 수정했습니다.</div>
    <div class="alert success" th:if="${param.participationUpdated}">참가 여부를 저장했습니다.</div>
    <div class="alert error" th:if="${param.invalidParticipation}">올바른 참가 상태를 선택해 주세요.</div>
    <article class="notice-detail schedule-detail">
        <div class="notice-toolbar">
            <a class="back-link" th:href="@{/schedules}">← 목록으로</a>
            <div class="admin-actions" sec:authorize="hasRole('ADMIN')">
                <a class="secondary-link" th:href="@{/schedules/{id}/edit(id=${schedule.id})}">수정</a>
                <form th:action="@{/schedules/{id}/delete(id=${schedule.id})}" method="post"
                      onsubmit="return confirm('이 풋살 일정을 삭제하시겠습니까?');">
                    <button class="danger-button" type="submit">삭제</button>
                </form>
            </div>
        </div>
        <header>
            <p class="eyebrow">MATCH DAY</p>
            <h1 th:text="${schedule.title}">정기 풋살</h1>
            <div class="schedule-facts">
                <div>
                    <span>일시</span>
                    <strong th:text="${#temporals.format(schedule.scheduledAt, 'yyyy년 MM월 dd일 (E) HH:mm')}">
                        2026년 08월 15일 18:00
                    </strong>
                </div>
                <div>
                    <span>장소</span>
                    <strong th:text="${schedule.location}">풋살장</strong>
                </div>
            </div>
            <div class="notice-meta">
                <span th:text="|등록 ${schedule.createdByName}|">등록자</span>
                <span th:if="${schedule.updatedAt != null}"
                      th:text="|수정 ${#temporals.format(schedule.updatedAt, 'yyyy.MM.dd HH:mm')}|">수정일</span>
            </div>
        </header>
        <div class="notice-content"
             th:text="${schedule.description != null ? schedule.description : '등록된 상세 안내가 없습니다.'}">
            일정 상세 안내
        </div>
    </article>

    <section class="participation-panel">
        <div class="participation-heading">
            <div>
                <p class="eyebrow">ATTENDANCE</p>
                <h2>참가 여부</h2>
            </div>
            <p th:if="${participation.myStatus == null}">아직 응답하지 않았습니다.</p>
            <p th:if="${participation.myStatus != null}"
               th:text="|현재 응답: ${participation.myStatus.label}|">현재 응답</p>
        </div>

        <div class="participation-actions">
            <form th:action="@{/schedules/{id}/participation(id=${schedule.id})}" method="post">
                <input type="hidden" name="status" value="ATTENDING">
                <button class="participation-button attending" type="submit"
                        th:classappend="${participation.myStatus == T(com.gukbabfc.schedule.entity.ParticipationStatus).ATTENDING} ? 'active'">
                    참가
                </button>
            </form>
            <form th:action="@{/schedules/{id}/participation(id=${schedule.id})}" method="post">
                <input type="hidden" name="status" value="NOT_ATTENDING">
                <button class="participation-button not-attending" type="submit"
                        th:classappend="${participation.myStatus == T(com.gukbabfc.schedule.entity.ParticipationStatus).NOT_ATTENDING} ? 'active'">
                    불참
                </button>
            </form>
            <form th:action="@{/schedules/{id}/participation(id=${schedule.id})}" method="post">
                <input type="hidden" name="status" value="UNDECIDED">
                <button class="participation-button undecided" type="submit"
                        th:classappend="${participation.myStatus == T(com.gukbabfc.schedule.entity.ParticipationStatus).UNDECIDED} ? 'active'">
                    미정
                </button>
            </form>
        </div>

        <div class="participation-summary">
            <article>
                <h3>참가 <strong th:text="${participation.attendingCount}">0</strong></h3>
                <p class="participant-empty" th:if="${#lists.isEmpty(participation.attendingMembers)}">응답한 회원이 없습니다.</p>
                <ul th:unless="${#lists.isEmpty(participation.attendingMembers)}">
                    <li th:each="member : ${participation.attendingMembers}" th:text="${member.name}">회원</li>
                </ul>
            </article>
            <article>
                <h3>불참 <strong th:text="${participation.notAttendingCount}">0</strong></h3>
                <p class="participant-empty" th:if="${#lists.isEmpty(participation.notAttendingMembers)}">응답한 회원이 없습니다.</p>
                <ul th:unless="${#lists.isEmpty(participation.notAttendingMembers)}">
                    <li th:each="member : ${participation.notAttendingMembers}" th:text="${member.name}">회원</li>
                </ul>
            </article>
            <article>
                <h3>미정 <strong th:text="${participation.undecidedCount}">0</strong></h3>
                <p class="participant-empty" th:if="${#lists.isEmpty(participation.undecidedMembers)}">응답한 회원이 없습니다.</p>
                <ul th:unless="${#lists.isEmpty(participation.undecidedMembers)}">
                    <li th:each="member : ${participation.undecidedMembers}" th:text="${member.name}">회원</li>
                </ul>
            </article>
        </div>
    </section>
</main>
</body>
</html>
