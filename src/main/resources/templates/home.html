<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>국밥FC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">국밥FC</a>
    <nav aria-label="주요 메뉴">
        <a th:href="@{/notices}">공지사항</a>
        <a th:href="@{/freeboards}">자유게시판</a>
        <a th:href="@{/players}">선수 프로필</a>
        <a href="#">풋살 일정</a>
        <a href="#">경기 결과</a>
        <a href="#">유니폼 신청</a>
    </nav>
    <div class="auth-menu">
        <th:block th:if="${signedIn}">
            <a th:href="@{/mypage}" th:text="|${username}님|">회원님</a>
            <form th:action="@{/logout}" method="post">
                <button class="link-button" type="submit">로그아웃</button>
            </form>
        </th:block>
        <th:block th:unless="${signedIn}">
            <a th:href="@{/login}">로그인</a>
            <a class="small-button" th:href="@{/signup}">회원가입</a>
        </th:block>
    </div>
</header>

<main>
    <section class="hero">
        <p class="eyebrow">든든하게 뛰고, 맛있게 먹자</p>
        <h1>국밥FC 팀 카페</h1>
        <p>우리 팀의 소식과 경기 일정을 함께 나누는 공간입니다.</p>
    </section>

    <section class="placeholder-grid" aria-label="준비 중인 기능">
        <article><h2>다음 경기</h2><p>풋살 일정과 참가 여부 기능이 들어올 자리입니다.</p></article>
        <article><h2>최근 공지</h2><p>팀 공지사항이 들어올 자리입니다.</p></article>
        <article><h2>최근 결과</h2><p>경기 결과가 들어올 자리입니다.</p></article>
    </section>
</main>

<footer>© 국밥FC</footer>
</body>
</html>
