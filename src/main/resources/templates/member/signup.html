<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 국밥FC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="auth-brand" th:href="@{/}">국밥FC</a>
    <h1>회원가입</h1>
    <p class="auth-description">국밥FC 팀 카페에서 사용할 계정을 만들어 주세요.</p>

    <form class="auth-form" th:action="@{/signup}" th:object="${signupRequest}" method="post">
        <div class="field">
            <label for="username">아이디</label>
            <input id="username" type="text" th:field="*{username}" autocomplete="username"
                   placeholder="영문과 숫자 4~20자">
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>
        <div class="field">
            <label for="name">이름</label>
            <input id="name" type="text" th:field="*{name}" autocomplete="name" placeholder="팀에서 사용할 이름">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password"
                   placeholder="8자 이상">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div class="field">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" type="password" th:field="*{passwordConfirm}" autocomplete="new-password">
            <p class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
        </div>
        <button class="primary-button" type="submit">가입하기</button>
    </form>

    <p class="auth-switch">이미 계정이 있나요? <a th:href="@{/login}">로그인</a></p>
</main>
</body>
</html>
