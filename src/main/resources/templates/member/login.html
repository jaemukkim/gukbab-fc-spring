<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 국밥FC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="auth-brand" th:href="@{/}">국밥FC</a>
    <h1>로그인</h1>
    <p class="auth-description">오늘도 든든하게 뛰어볼까요?</p>

    <div class="alert success" th:if="${param.signup}">회원가입이 완료되었습니다. 로그인해 주세요.</div>
    <div class="alert error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <div class="alert" th:if="${param.logout}">로그아웃되었습니다.</div>

    <form class="auth-form" th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" autocomplete="username" autofocus>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <button class="primary-button" type="submit">로그인</button>
    </form>

    <p class="auth-switch">아직 계정이 없나요? <a th:href="@{/signup}">회원가입</a></p>
</main>
</body>
</html>
