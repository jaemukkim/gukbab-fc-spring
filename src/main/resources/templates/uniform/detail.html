<!DOCTYPE html>
<!-- 유니폼 신청 기간의 상세 안내와 관리자 상태 변경 기능을 보여줍니다. -->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${period.title + ' | 국밥FC'}">유니폼 신청 | 국밥FC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="simple-header">
    <a class="brand" th:href="@{/}">국밥FC</a>
    <nav><a th:href="@{/uniform-orders}">유니폼 신청 목록</a></nav>
</header>

<main class="content-page narrow-page">
    <div class="alert success" th:if="${param.updated}">신청 기간을 수정했습니다.</div>
    <div class="alert success" th:if="${param.closed}">유니폼 신청을 마감했습니다.</div>
    <div class="alert success" th:if="${param.reopened}">유니폼 신청을 다시 열었습니다.</div>
    <div class="alert success" th:if="${param.applicationSaved}">유니폼 신청을 저장했습니다.</div>
    <div class="alert success" th:if="${param.applicationCancelled}">유니폼 신청을 취소했습니다.</div>
    <div class="alert error" th:if="${applicationError}" th:text="${applicationError}">신청 오류</div>

    <article class="notice-detail uniform-detail">
        <div class="notice-toolbar">
            <a class="back-link" th:href="@{/uniform-orders}">← 목록으로</a>
            <div class="admin-actions" sec:authorize="hasRole('ADMIN')">
                <a class="secondary-link" th:href="@{/uniform-orders/{id}/edit(id=${period.id})}">수정</a>
                <form th:if="${period.status.name() != 'CLOSED'}"
                      th:action="@{/uniform-orders/{id}/close(id=${period.id})}" method="post"
                      onsubmit="return confirm('유니폼 신청을 마감하시겠습니까?');">
                    <button class="danger-button" type="submit">마감</button>
                </form>
                <form th:if="${period.status.name() == 'CLOSED'}"
                      th:action="@{/uniform-orders/{id}/reopen(id=${period.id})}" method="post">
                    <button class="secondary-button" type="submit">재오픈</button>
                </form>
            </div>
        </div>

        <header>
            <span class="status-badge" th:classappend="${period.status.name().toLowerCase()}"
                  th:text="${period.status.label}">신청 중</span>
            <h1 th:text="${period.title}">2026 홈 유니폼 신청</h1>
            <div class="uniform-period-facts">
                <div>
                    <span>시작</span>
                    <strong th:text="${#temporals.format(period.startsAt, 'yyyy년 MM월 dd일 HH:mm')}">시작 시각</strong>
                </div>
                <div>
                    <span>마감</span>
                    <strong th:text="${#temporals.format(period.endsAt, 'yyyy년 MM월 dd일 HH:mm')}">마감 시각</strong>
                </div>
            </div>
            <div class="notice-meta">
                <span th:text="|등록 ${period.createdByName}|">등록자</span>
                <span th:if="${period.updatedAt != null}"
                      th:text="|수정 ${#temporals.format(period.updatedAt, 'yyyy.MM.dd HH:mm')}|">수정일</span>
            </div>
        </header>
        <div class="notice-content"
             th:text="${period.description != null ? period.description : '등록된 신청 안내가 없습니다.'}">
            신청 안내
        </div>

        <section class="uniform-application-panel" th:if="${period.status.name() == 'OPEN'}">
            <div class="uniform-application-heading">
                <div>
                    <p class="eyebrow">MY ORDER</p>
                    <h2 th:text="${myApplication == null ? '구매 신청' : '내 신청 수정'}">구매 신청</h2>
                </div>
                <span th:if="${myApplication != null}">신청 완료</span>
            </div>

            <form class="uniform-application-form"
                  th:action="@{/uniform-orders/{id}/application(id=${period.id})}"
                  th:object="${uniformApplicationRequest}" method="post">
                <div class="field-row uniform-order-fields">
                    <div class="field">
                        <label for="size">사이즈</label>
                        <select id="size" th:field="*{size}">
                            <option value="">선택</option>
                            <option th:each="sizeOption : ${uniformSizes}"
                                    th:value="${sizeOption}" th:text="${sizeOption.label}">L</option>
                        </select>
                        <p class="field-error" th:if="${#fields.hasErrors('size')}" th:errors="*{size}"></p>
                    </div>
                    <div class="field">
                        <label for="backNumber">등번호</label>
                        <input id="backNumber" type="number" th:field="*{backNumber}" min="0" max="99">
                        <p class="field-error" th:if="${#fields.hasErrors('backNumber')}" th:errors="*{backNumber}"></p>
                    </div>
                </div>
                <div class="field-row uniform-order-fields">
                    <div class="field">
                        <label for="markingName">마킹 이름</label>
                        <input id="markingName" type="text" th:field="*{markingName}" maxlength="20"
                               placeholder="예: KIM">
                        <p class="field-error" th:if="${#fields.hasErrors('markingName')}" th:errors="*{markingName}"></p>
                    </div>
                    <div class="field">
                        <label for="quantity">수량</label>
                        <input id="quantity" type="number" th:field="*{quantity}" min="1" max="10">
                        <p class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></p>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="primary-button" type="submit"
                            th:text="${myApplication == null ? '신청하기' : '수정하기'}">신청하기</button>
                </div>
            </form>

            <form class="uniform-cancel-form" th:if="${myApplication != null}"
                  th:action="@{/uniform-orders/{id}/application/cancel(id=${period.id})}" method="post"
                  onsubmit="return confirm('유니폼 구매 신청을 취소하시겠습니까?');">
                <button class="danger-button" type="submit">신청 취소</button>
            </form>
        </section>

        <div class="uniform-application-placeholder closed" th:unless="${period.status.name() == 'OPEN'}">
            <strong th:text="${period.status.name() == 'UPCOMING' ? '아직 신청 기간이 아닙니다.' : '신청이 마감되었습니다.'}">
                신청 상태
            </strong>
            <p th:if="${myApplication != null}"
               th:text="|내 신청: ${myApplication.size.label} / ${myApplication.backNumber}번 / ${myApplication.markingName} / ${myApplication.quantity}개|">
                내 신청 정보
            </p>
        </div>
    </article>

    <section class="uniform-admin-summary" sec:authorize="hasRole('ADMIN')">
        <div class="uniform-application-heading">
            <div><p class="eyebrow">ORDER SUMMARY</p><h2>전체 신청 현황</h2></div>
            <strong th:text="|총 ${applicationSummary.totalQuantity}개|">총 0개</strong>
        </div>

        <div class="uniform-size-summary">
            <div th:each="sizeOption : ${uniformSizes}">
                <span th:text="${sizeOption.label}">L</span>
                <strong th:text="|${applicationSummary.quantityBySize.get(sizeOption)}개|">0개</strong>
            </div>
        </div>

        <div class="empty-state schedule-empty" th:if="${#lists.isEmpty(applicationSummary.applications)}">
            <p>아직 유니폼 신청자가 없습니다.</p>
        </div>
        <div class="uniform-application-table-wrap" th:unless="${#lists.isEmpty(applicationSummary.applications)}">
            <table class="uniform-application-table">
                <thead>
                <tr><th>신청자</th><th>사이즈</th><th>등번호</th><th>마킹</th><th>수량</th></tr>
                </thead>
                <tbody>
                <tr th:each="orderApplication : ${applicationSummary.applications}">
                    <td th:text="${orderApplication.memberName}">회원</td>
                    <td th:text="${orderApplication.size.label}">L</td>
                    <td th:text="${orderApplication.backNumber}">10</td>
                    <td th:text="${orderApplication.markingName}">KIM</td>
                    <td th:text="|${orderApplication.quantity}개|">1개</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
